#cloud-config

package_update: true

packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Cloud Services - Week 7</title>
      </head>
      <body>
        <h1>Cloud Services - Week 7</h1>
        <p>Student: ${student_name}</p>
        <p>${page_message}</p>
        <p>Deployed automatically using OpenTofu and cloud-init.</p>
      </body>
      </html>

runcmd:
  - systemctl enable apache2
  - systemctl restart apache2